<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil | Hi & Hello</title>

    <link rel="stylesheet" href="perfil.css">
</head>

<body>

    <main class="perfil-container">

        <section class="perfil-card">

            <div class="perfil-logo">
                Hi & Hello
                <small>BAKERY • CAFÉ</small>
            </div>

            <h1>Meu Perfil</h1>

            <p class="subtitulo">
                Bem-vindo à sua conta ☕
            </p>


            <!-- DADOS DO USUÁRIO -->

            <div class="usuario-info">

                <div class="info-item">

                    <div class="icone">
                        👤
                    </div>

                    <div>
                        <small>Nome</small>
                        <p id="nomeUsuario">Carregando...</p>
                    </div>

                </div>


                <div class="info-item">

                    <div class="icone">
                        📧
                    </div>

                    <div>
                        <small>E-mail</small>
                        <p id="emailUsuario">Carregando...</p>
                    </div>

                </div>


                <div class="info-item">

                    <div class="icone">
                        📱
                    </div>

                    <div>
                        <small>Telefone</small>
                        <p id="telefoneUsuario">Carregando...</p>
                    </div>

                </div>

            </div>


            <!-- BOTÃO SAIR -->

            <button
                id="sairButton"
                class="botao-sair">

                👋 Sair da conta

            </button>


            <a
                href="./index.html"
                class="voltar">

                Voltar para o início

            </a>

        </section>

    </main>


    <script
        type="module"
        src="./js/perfil.js">
    </script>

</body>

</html>
