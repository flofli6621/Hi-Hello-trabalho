<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Hi & Hello</title>

    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <form id="cadastro-form">

        <div class="logo">
            Hi & Hello
        </div>

        <h1>Crie sua conta</h1>

        <p class="subtitulo">
            Preencha seus dados para realizar o cadastro
        </p>

        <div id="mensagem"></div>


        <div class="card-cadastro">

            <h2>Dados pessoais</h2>

            <label for="nome">Nome:</label>
            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome"
                required
            >

            <label for="email">E-mail:</label>
            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label for="telefone">Telefone:</label>
            <input
                type="tel"
                id="telefone"
                placeholder="Digite seu telefone"
                required
            >

        </div>


        <div class="card-cadastro">

            <h2>Segurança</h2>

            <label for="senha">Senha:</label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button
                    type="button"
                    class="mostrar-senha"
                    data-target="senha">
                    👁
                </button>

            </div>


            <div id="forca-senha"></div>


            <label for="confirmar-senha">
                Confirmar senha:
            </label>

            <div class="campo-senha">

                <input
                    type="password"
                    id="confirmar-senha"
                    placeholder="Confirme sua senha"
                    required
                >

                <button
                    type="button"
                    class="mostrar-senha"
                    data-target="confirmar-senha">
                    👁
                </button>

            </div>


            <button type="submit">
                Cadastrar
            </button>

        </div>

    </form>


    <script type="module" src="./js/cadastro.js"></script>

</body>

</html>
