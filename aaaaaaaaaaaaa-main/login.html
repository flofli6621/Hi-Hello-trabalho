<html lang="pt-br">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Login da Hi & Hello">
    <title>Login | Hi & Hello</title>

<link rel="stylesheet" href="login.css">
```

</head>

<body>

```
<a href="index.html" class="voltar">
    ← Voltar
</a>

<main class="container">

    <section class="login-card">

        <div class="decoracao"></div>

        <div class="logo">
            <h1>Hi <span>&</span> Hello</h1>
            <p>Bem-vindo de volta à nossa padaria ☕</p>
        </div>

        <div id="message" class="message"></div>

        <form id="loginForm">

            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <div class="input-container">

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>

            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <div class="input-container">

                    <input
                        type="password"
                        id="password"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >
                        Mostrar
                    </button>

                </div>

                <a
                    href="#"
                    class="forgot-password"
                    id="forgotPassword"
                >
                    Esqueci minha senha
                </a>

            </div>

            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Entrar na minha conta
            </button>

        </form>

        <div class="register">
            Ainda não possui uma conta?

            <a href="cadastro.html">
                Criar conta
            </a>
        </div>

    </section>

</main>

<script type="module" src="./js/login.js"></script>
```

</body>

</html>
